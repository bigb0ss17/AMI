<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A.m.I</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>A.m.I</h1>
        <h2>Short for "Am I A.I?"</h2>
        <p>Analyze images, videos, audio, and links for signs of AI-generated content.</p>
    </header>

    <main>
        <section class="upload-section">

            <h2>Select Your Media</h2>

            <div class="buttons">
                <button id="imageButton">
                    🖼️ Upload Image
                </button>

                <button id="videoButton">
                    🎥 Upload Video
                </button>

                <button id="audioButton">
                    🎤 Upload Audio
                </button>

                <button id="cameraButton">
                    📷 Use Camera
                </button>

            </div>

            <!-- Hidden file inputs -->
            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <input
                type="file"
                id="videoInput"
                accept="video/*"
                hidden
            >

            <input
                type="file"
                id="audioInput"
                accept="audio/*"
                hidden
            >

        </section>

        <section class="link-section">

    <h2>Analyze a Link</h2>

    <input
        type="url"
        id="mediaURL"
        placeholder="Paste a video or image link here..."
    >

    <button id="linkButton">
        🔍 Analyze Link
    </button>

        </section>


        <section class="preview-section">

            <h2>Preview</h2>

            <div id="preview">

                <p>No media selected.</p>

            </div>

        </section>


        <section class="camera-section" id="cameraSection">

            <h2>Camera</h2>

            <video id="cameraPreview" autoplay playsinline></video>

            <button id="captureButton">
                Capture Photo
            </button>

            <canvas id="cameraCanvas" hidden></canvas>

        </section>


        <button id="analyzeButton">
            Analyze Media
        </button>

        <div id="result"></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
